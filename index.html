<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.G.A.P. Live Seizure Monitoring Dashboard</title>
    <!-- Include MQTT WebSockets Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { background: #fafafa; margin: 15px 0; padding: 15px; border-radius: 8px; border-left: 5px solid #007bff; }
        .alert { border-left-color: #dc3545; background: #fff5f5; }
        h1 { color: #2c3e50; }
        .metric { font-size: 24px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>A.G.A.P. Live Monitor</h1>
        <p>Real-time telemetry stream via HiveMQ Cloud</p>

        <div id="statusCard" class="card">
            <div>System Status</div>
            <div id="status" class="metric">Connecting...</div>
        </div>

        <div class="card">
            <div>Heart Rate</div>
            <div id="heartRate" class="metric">-- BPM</div>
        </div>

        <div class="card">
            <div>sEMG Voltage (Muscle Activity)</div>
            <div id="emgVolts" class="metric">-- V</div>
        </div>

        <div class="card">
            <div>Accelerometer (Total G)</div>
            <div id="accelG" class="metric">-- G</div>
        </div>
    </div>

    <script>
        // HiveMQ Cloud WebSocket connection details
        const brokerUrl = 'wss://4f91cb700d614ff8ad3d9d429225c7db.s1.eu.hivemq.cloud:8884/mqtt';

        const options = {
            clientId: 'web_dashboard_' + Math.random().toString(16).substring(2, 8),
            username: 'Breadisgood',
            password: 'Krystala_1527',
            clean: true
        };

        console.log("Connecting to HiveMQ broker...");
        const client = mqtt.connect(brokerUrl, options);

        client.on('connect', function () {
            console.log("Connected to HiveMQ live stream!");
            document.getElementById('status').innerText = "Connected (Waiting for data...)";
            client.subscribe('agap/telemetry', function (err) {
                if (!err) {
                    console.log("Subscribed to agap/telemetry");
                }
            });
        });

        client.on('error', function (error) {
            console.error("Connection error: ", error);
            document.getElementById('status').innerText = "Connection Failed";
        });

        // Instantly update elements when a new message comes from your ESP32
        client.on('message', function (topic, payload) {
            try {
                let data = JSON.parse(payload.toString());
                console.log("Live Data Received:", data);

                document.getElementById('status').innerText = data.status;
                document.getElementById('heartRate').innerText = data.heart_rate + " BPM";
                document.getElementById('emgVolts').innerText = data.emg_volts + " V";
                document.getElementById('accelG').innerText = data.accel_g + " G";

                // Change card style dynamically if ALERT is triggered
                let card = document.getElementById('statusCard');
                if (data.status === "ALERT") {
                    card.classList.add('alert');
                } else {
                    card.classList.remove('alert');
                }
            } catch (e) {
                console.error("Error parsing incoming JSON:", e);
            }
        });
    </script>

</body>
</html>
